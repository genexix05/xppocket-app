server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /terms {
        try_files /terms.html =404;
    }

    location ~ ^/(en|pt|fr|de)/privacy/?$ {
        try_files /$1/privacy.html =404;
    }

    location ~ ^/(en|pt|fr|de)/terms/?$ {
        try_files /$1/terms.html =404;
    }

    # Guides index (language-specific segment)
    location = /guias {
        return 301 /guias/;
    }
    location = /guias/ {
        try_files /guias/index.html =404;
    }
    location ~ ^/guias/([^/]+)/?$ {
        try_files /guias/$1.html =404;
    }

    location ~ ^/(en|fr)/guides/?$ {
        try_files /$1/guides/index.html =404;
    }
    location ~ ^/(en|fr)/guides/([^/]+)/?$ {
        try_files /$1/guides/$2.html =404;
    }

    location ~ ^/pt/guias/?$ {
        try_files /pt/guias/index.html =404;
    }
    location ~ ^/pt/guias/([^/]+)/?$ {
        try_files /pt/guias/$1.html =404;
    }

    location ~ ^/de/anleitungen/?$ {
        try_files /de/anleitungen/index.html =404;
    }
    location ~ ^/de/anleitungen/([^/]+)/?$ {
        try_files /de/anleitungen/$1.html =404;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        default_type application/xml;
    }

    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
